<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Đang chuyển đến trang liên hệ</title>
    <meta http-equiv="refresh" content="0; url=/Contact">
    <style>
        @font-face {
            font-family: system-ui;
            src: local("Segoe UI"), local("Roboto"), local("Helvetica Neue"), local("Arial");
        }
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #fff6ef;
            color: #3c2415;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        .notice {
            background: #fff;
            border: 1px solid #ffd7b1;
            border-radius: 20px;
            padding: 32px 40px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.08);
        }
        .notice h1 {
            margin-bottom: 12px;
            font-size: 1.5rem;
            color: #e3741c;
        }
        .notice p {
            margin-bottom: 20px;
        }
        .notice a {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 12px 26px;
            border-radius: 999px;
            background: linear-gradient(120deg, #f0821b, #e76f51);
            color: #fff;
            text-decoration: none;
            font-weight: 600;
            box-shadow: 0 12px 30px rgba(231, 111, 81, 0.35);
        }
    </style>
    <script>
        (function () {
            var target = "/Contact";
            if (window.location.pathname !== target) {
                window.location.replace(target);
            }
        })();
    </script>
</head>
<body>
    <div class="notice">
        <h1>Trang liên hệ đã chuyển</h1>
        <p>Vui lòng sử dụng trang liên hệ mới để gửi thông tin và để quản trị viên nhận được chính xác.</p>
        <a href="/Contact">Đi đến trang liên hệ</a>
    </div>
</body>
</html>
